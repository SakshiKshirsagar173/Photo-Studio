<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Studio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    body {
      background: #000;
      color: #fff;
      line-height: 1.6;
    }

    /* ================= HERO SECTION ================= */
    .hero {
      position: relative;
      min-height: 90vh;
      background: radial-gradient(circle at top left, #1c1c1c, #000);
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 45%;
      height: 100%;
      background: url("photographer.png") center / cover no-repeat;
      opacity: 0.9;

      -webkit-mask-image: radial-gradient(circle at top left, black 45%, transparent 75%);
      mask-image: radial-gradient(circle at top left, black 45%, transparent 75%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 720px;
      padding: 120px 32px;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 1.2rem;
      color: #bbb;
    }

    /* ================= SERVICES ================= */
    .services {
      padding: 80px 24px;
      background: #0b0b0b;
    }

    .services h2 {
      text-align: center;
      font-size: 2.4rem;
      margin-bottom: 48px;
    }

    .service-card {
      max-width: 900px;
      margin: auto;
      background: #111;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    .service-card img {
      width: 100%;
      display: block;
    }

    .service-card .content {
      padding: 24px;
    }

    .service-card h3 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    .service-card p {
      color: #aaa;
    }

    /* ================= MOBILE FIX ================= */
    @media (max-width: 768px) {
      .hero {
        min-height: 100vh;
      }

      .hero-bg {
        width: 100%;
        height: 100%;
        opacity: 0.35;
        -webkit-mask-image: none;
        mask-image: none;
      }

      .hero-content {
        padding-top: 160px;
        text-align: center;
      }

      .hero h1 {
        font-size: 2.2rem;
      }

      .hero p {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <h1>Capturing Childhood, Motherhood & Weddings</h1>
      <p>Professional Kids, Maternity & Wedding Photography</p>
    </div>
  </section>

  <!-- SERVICES -->
  <section class="services">
    <h2>Our Services</h2>

    <div class="service-card">
      <img src="kids.jpg" alt="Kids Photography">
      <div class="content">
        <h3>Kids Photography</h3>
        <p>Newborn, toddler & birthday photoshoots.</p>
      </div>
    </div>
  </section>

</body>
</html>
